[package]
name = "GmicVideo"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
pollster = "1.0.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl"] }
